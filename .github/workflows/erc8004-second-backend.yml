name: ERC8004 Solidity and Vyper bounded comparison
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pinned-second-backend:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.15.0'
      - run: python -B tools/verify_artifacts.py
      - run: python -B tools/second_backend_integration/replay.py check
      - run: python -B -m unittest discover -s tests/second_backend_integration -v
      - run: python -B -O -m unittest discover -s tests/second_backend_integration -v
      - run: python -B tools/second_backend_integration/ci.py
      - name: Verify final source and history binding
        if: always()
        run: python -B tools/second_backend_integration/replay.py check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: erc8004-second-backend-current-replay
          path: build/second-backend-integration
