name: Reproduce research
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: build/erc8378-baseline
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Authenticate current ERC8378 transition and prepare baseline
        working-directory: .
        run: python -B experiments/erc8378-rvr-veca-v1/ci/transition.py prepare
      - run: python -B tools/verify_artifacts.py
      - run: python -B tools/validate.py --out build/ci
      - run: python -B tools/verify_artifacts.py
      - name: Recheck current ERC8378 transition and baseline bytes
        if: always()
        working-directory: .
        run: python -B experiments/erc8378-rvr-veca-v1/ci/transition.py check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-python-${{ matrix.python }}
          path: |
            build/erc8378-baseline/build/ci
            build/erc8378-ci/CURRENT_BINDING.json
