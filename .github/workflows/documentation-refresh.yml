name: Documentation transition and frozen source binding
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  exact-documentation-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -B tools/verify_artifacts.py
      - run: python -B tools/documentation_refresh/replay.py check
      - run: python -B -m unittest discover -s tests/documentation_refresh -v
      - run: python -B -O -m unittest discover -s tests/documentation_refresh -v
      - run: python -B tools/documentation_refresh/replay.py prepare
      - run: python -B tools/pr12_pr13_integration/preservation.py
        working-directory: build/documentation-replay
      - run: python -B tools/erc8404/integrity.py
      - run: python -B tools/documentation_refresh/replay.py check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: documentation-replay-binding
          path: build/documentation-refresh
