name: Real artifact composition v2
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native-and-crypto-replay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: build/erc8378-baseline
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.15.0'
      - name: Authenticate current ERC8378 transition and prepare baseline
        working-directory: .
        run: python -B experiments/erc8378-rvr-veca-v1/ci/transition.py prepare
      - run: python -B tools/verify_artifacts.py
      - run: python -B research/formal-v1/prepare_crypto.py
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix build/formal-v1/crypto
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - run: git clone https://github.com/trustless-ai/zkIE build/chain-v2/zkIE
      - run: git -C build/chain-v2/zkIE checkout --detach 39d8df96877bc3bebf33c69b06907d792b3184b9
      - run: python -B tools/v2/prepare.py --online
      - run: python -B tools/v2/statement.py
      - run: python -B tools/v2/validate.py
      - run: python -B tools/v2/check_snapshot.py
      - run: python -B tools/v2/validate_survivors.py
      - run: python -B tools/verify_artifacts.py
      - name: Recheck current ERC8378 transition and baseline bytes
        if: always()
        working-directory: .
        run: python -B experiments/erc8378-rvr-veca-v1/ci/transition.py check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-artifact-v2-replay
          path: |
            build/erc8378-baseline/build/v2
            build/erc8378-ci/CURRENT_BINDING.json
